name: Self-hosted Docker image

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and test the frontend
        working-directory: web/static
        run: npm ci && npm test && npm run build
      - name: Test and build the server
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          package="$(go list -m)/internal/app/build"
          built="$(date -u +%FT%TZ)"
          go build -trimpath -ldflags "-s -w -X $package.Version=$GITHUB_REF_NAME -X $package.Commit=$GITHUB_SHA -X $package.BuildDate=$built -X $package.Mode=production" -o build/atvloadly-linux-amd64 .
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_NAME=atvloadly
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
