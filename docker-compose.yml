version: '3.3'
services:
  atvloadly:
    container_name: atvloadly
    hostname: atvloadly
    image: ghcr.io/xcy960815/atvloadly:selfhost-0.8.6-fork.3
    security_opt:
      - seccomp:unconfined
    volumes:
      - /etc/atvloadly:/data
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon 
    ports:
      - 5533:80/tcp
    ulimits:
      core: 0
    restart: unless-stopped
